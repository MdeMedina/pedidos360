# ============================================================================
# infra/mq/rabbitmq.conf  ->  configuracion compartida por rabbit1 y rabbit2
#
# Este archivo se monta IDENTICO en los dos nodos. Esa es la idea del
# descubrimiento "classic_config": cada nodo lee la misma lista de miembros y
# se une al cluster el solo al arrancar, sin scripts de entrypoint ni
# "rabbitmqctl join_cluster" a mano.
# ============================================================================

# --- Formacion del cluster -------------------------------------------------
# La lista de nodos es FIJA y conocida de antemano, que es exactamente el caso
# de un compose con dos servicios. El nombre de nodo es rabbit@<hostname>, por
# eso en el compose cada servicio fija su hostname.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Cada cuanto se limpia del cluster un nodo que ya no existe.
cluster_formation.node_cleanup.interval = 10000
# Con dos nodos NO conviene expulsar automaticamente al que se cae: si se va
# rabbit2 queremos que al volver se reincorpore, no que haya sido borrado.
cluster_formation.node_cleanup.only_log_warning = true

# Reparto de los masters de cola entre nodos. La guia 2.3.1 trae
# "queue_master_location = all", que esta mal por partida doble: el parametro
# se llama queue_master_locatOR, y "all" no es un valor valido (acepta
# client-local, random y min-masters). Tal cual viene en la guia, el nodo no
# arranca: "Conf file attempted to set unknown variable".
# min-masters es lo que se buscaba: coloca cada cola nueva en el nodo que menos
# colas tenga, repartiendo la carga entre rabbit1 y rabbit2.
queue_master_locator = min-masters

# Nombre visible en Management UI -> Overview.
cluster_name = pedidos360-cluster

# --- Definiciones declarativas (usuario, permisos y politicas) -------------
# Se importan en cada arranque. Aqui viven las politicas de retencion y
# limpieza, que asi quedan versionadas en el repositorio en vez de aplicadas a
# mano con rabbitmqctl.
load_definitions = /etc/rabbitmq/definitions.json
