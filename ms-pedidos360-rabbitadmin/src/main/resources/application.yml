server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-pedidos360-rabbitadmin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  rabbitmq:
    # Los DOS nodos del cluster. Spring AMQP recorre la lista hasta conectar,
    # asi que si rabbit1 se cae el servicio sigue publicando contra rabbit2 sin
    # tocar configuracion. Con host/port solos esa tolerancia no existe.
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:5672,${RABBITMQ_HOST:localhost}:5673}
    # Sin esto el failover tarda un minuto: el intento contra el nodo caido
    # agota el timeout por defecto (60s) antes de probar el siguiente de la
    # lista. En EC2 el security group descarta los paquetes en vez de
    # rechazarlos, asi que no hay un "connection refused" rapido que corte.
    connection-timeout: 5s
    # Reparte las conexiones entre los dos nodos en vez de amontonarlas
    # todas en el primero de la lista.
    address-shuffle-mode: random
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360}

pedidos360:
  security:
    audiences: ${PEDIDOS360_AUDIENCES:api://pedidos360-api,1e8d01fa-bd60-4403-ae34-4288007ed4dd}
    jwk-set-uri: ${PEDIDOS360_JWK_SET_URI:https://login.microsoftonline.com/41f0982b-bfd4-40ea-8b24-cd683cd0f362/discovery/v2.0/keys}
    dev-secret: ${PEDIDOS360_DEV_SECRET:pedidos360-dev-secret-cambia-esto-en-produccion-1234567890}
    dev-issuer: ${PEDIDOS360_DEV_ISSUER:http://localhost/dev-issuer}
    cors-enabled: ${PEDIDOS360_CORS_ENABLED:true}
    cors-allowed-origins: ${PEDIDOS360_CORS_ORIGINS:http://localhost:*,https://localhost:*}
  messaging:
    # Este microservicio NO tiene sentido sin broker: se habilita por defecto.
    rabbit-enabled: ${PEDIDOS360_RABBIT_ENABLED:true}
    kafka-enabled: false

management:
  health:
    rabbit:
      enabled: ${pedidos360.messaging.rabbit-enabled:true}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: azure
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PEDIDOS360_ISSUER_URI:https://login.microsoftonline.com/41f0982b-bfd4-40ea-8b24-cd683cd0f362/v2.0}
